name: Sync fork with upstream
on:
  schedule:
    - cron: '0 3 * * *'      # 每天 UTC 03:00（北京 11:00）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync kalihah/MoonTV-new --source Stardm0/MoonTV --branch main

name: Sync fork with upstream

on:
  schedule:
    - cron: '17 3 * * 1' # Monday 11:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy upstream app files, preserving fork settings
        run: |
          git fetch --no-tags https://github.com/Stardm0/MoonTV.git main
          git restore --source=FETCH_HEAD --staged --worktree -- .
          git restore --source=HEAD --staged --worktree -- .github/workflows config.json wrangler.toml

          if git diff --cached --quiet; then
            echo 'Already up to date.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync app files from upstream'
          git push origin HEAD:main
